substitutions:
  device_name: ceiling-fan

esphome:
  name: ${device_name}

rtl87xx:
  board: wbr3
  framework:
    version: latest

logger:

api:

ota:
  - platform: esphome

web_server:

captive_portal:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

uart:
  id: tuya_uart
  tx_pin: PA14
  rx_pin: PA13
  baud_rate: 9600

tuya:
  uart_id: tuya_uart
  on_datapoint_update:
    - sensor_datapoint: 20
      then:
        - logger.log: "DP20 switch_led updated"
    - sensor_datapoint: 21
      then:
        - logger.log: "DP21 work_mode updated"
    - sensor_datapoint: 23
      then:
        - logger.log: "DP23 temp_value updated"
    - sensor_datapoint: 24
      then:
        - logger.log: "DP24 colour_data updated"
    - sensor_datapoint: 25
      then:
        - logger.log: "DP25 scene_data updated"
    - sensor_datapoint: 28
      then:
        - logger.log: "DP28 control_data updated"
    - sensor_datapoint: 58
      then:
        - logger.log: "DP58 brightness_min_1 updated"
    - sensor_datapoint: 59
      then:
        - logger.log: "DP59 led_type_1 updated"
    - sensor_datapoint: 60
      then:
        - logger.log: "DP60 fan_switch updated"
    - sensor_datapoint: 62
      then:
        - logger.log: "DP62 fan_speed updated"
    - sensor_datapoint: 63
      then:
        - logger.log: "DP63 fan_direction updated"
    - sensor_datapoint: 64
      then:
        - logger.log: "DP64 fan_countdown_left updated"

# Bring-up-only entities. Confirm the DP types and values from logs before
# replacing these with final fan/light entities.
switch:
  - platform: tuya
    name: Light Power Candidate
    switch_datapoint: 20
  - platform: tuya
    name: Fan Power Candidate
    switch_datapoint: 60

number:
  - platform: tuya
    name: Minimum Brightness Candidate
    number_datapoint: 58
    min_value: 10
    max_value: 1000
    step: 1
  - platform: tuya
    name: Cold Warm Value Candidate
    number_datapoint: 23
    min_value: 0
    max_value: 1000
    step: 1
  - platform: tuya
    name: Fan Timer Candidate
    number_datapoint: 64
    min_value: 0
    max_value: 540
    step: 1

select:
  - platform: tuya
    name: Light Mode Candidate
    enum_datapoint: 21
    options:
      0: White
      1: Colour
      2: Scene
      3: Music
  - platform: tuya
    name: LED Type Candidate
    enum_datapoint: 59
    options:
      0: LED
      1: Incandescent
      2: Halogen

text_sensor:
  - platform: tuya
    name: Colour Data
    sensor_datapoint: 24
  - platform: tuya
    name: Scene Data
    sensor_datapoint: 25
  - platform: tuya
    name: Control Data
    sensor_datapoint: 28

fan:
  - platform: tuya
    name: Ceiling Fan Candidate
    switch_datapoint: 60
    speed_datapoint: 62
    speed_count: 6
    direction_datapoint: 63
